# UroJEPA†: same CT pre-training as UroJEPA, with the encoder initialised from the
# public natural-video V-JEPA 2.1 ViT-B/16 weights:
#
#   wget https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitb_dist_vitG_384.pt -P checkpoints/
#
# Only the encoder is transferred (key `ema_encoder`); the predictor starts from scratch.

_base_: urojepa_vitb16.yaml

folder: outputs/pretrain/urojepa_dagger_vitb16

model:
  init_checkpoint: checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
  init_checkpoint_key: ema_encoder
